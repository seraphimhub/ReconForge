[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconforge"
version = "0.1.0"
description = "A modular, authorization-first recon CLI for defensive cyber security assessment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ReconForge Contributors" }]
dependencies = [
  "dnspython>=2.6.1",
  "httpx>=0.27.0",
  "PyYAML>=6.0.1",
  "rich>=13.7.1",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
reconforge = "reconforge.cli:app"

[tool.setuptools.packages.find]
include = ["reconforge*"]
